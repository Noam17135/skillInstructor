name: Weekly refresh
# Updates install counts, GitHub stars, last-update dates and evidence labels for every skill.
on:
  schedule:
    - cron: '17 3 * * 0'   # every Sunday 03:17 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh facts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/refresh.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data llms.txt; then echo "No changes"; exit 0; fi
          git config user.name "catalog-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add data llms.txt index.html version.txt
          git commit -m "Weekly data refresh"
          git push
